name: Code health

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install scc
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/scc_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            'https://github.com/boyter/scc/releases/download/v3.7.0/scc_Linux_x86_64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            '3d9d65b00ca874c2b29151abe7e1480736f5229edc3ce8e4b2791460cdfabf5a' \
            "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install "$RUNNER_TEMP/scc" "$HOME/.local/bin/scc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/scc" --version

      - name: Install code-health and analyzers
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" lizard==1.24.1
          npm install --global jscpd@5.4.1

      - name: Scan repository
        run: code-health scan --output-dir .code-health/reports .

      - name: Render SARIF
        run: code-health report --format sarif > code-health.sarif

      - name: Validate analyzer coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.code-health/reports/report.json').read_text())
          unavailable = report.get('unavailable_tools', [])
          if unavailable:
              print('::warning::Unavailable analyzers: ' + ', '.join(unavailable))
          incomplete = any(
              item.get('provenance') and not item['provenance']['parse_complete']
              for collection in ('files', 'functions', 'evidence')
              for item in report[collection]
          )
          if incomplete:
              print('::warning::Analyzer evidence is parse-incomplete; review report diagnostics.')
          if not unavailable and not incomplete:
              print('All configured analyzers have complete parse provenance.')
          print(f"Findings: {len(report.get('findings', []))}")
          PY

      - name: Upload SARIF artifact
        if: always() && hashFiles('code-health.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: code-health-sarif
          path: code-health.sarif
          if-no-files-found: error

      - name: Upload SARIF to code scanning
        if: success() && vars.CODE_HEALTH_UPLOAD_SARIF == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          sarif_file: code-health.sarif
